name: Bug report
description: Report a reproducible problem in companion code
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: part
    attributes:
      label: Related book part
      placeholder: "e.g. Part 13"
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
